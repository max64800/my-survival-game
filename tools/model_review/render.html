<!doctype html><meta charset=utf8><body style="margin:0;background:#77706a">
<canvas id=out></canvas>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
const files = new URLSearchParams(location.search).get("f").split(",");
const T = 300, LBL = 22, COLS = 4;
const out = document.getElementById("out"), ctx = out.getContext("2d");
out.width = T * COLS; out.height = files.length * (T + LBL);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(T, T); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.3;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x77706a);
scene.add(new THREE.HemisphereLight(0xffffff, 0x554433, 1.4));
const key = new THREE.DirectionalLight(0xfff1dc, 2.0); key.position.set(3, 5, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0xc8d4ff, 0.7); fill.position.set(-4, 2, -3); scene.add(fill);
const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 200);
const loader = new GLTFLoader();
// views: front, right side, back, 3/4 from above
const VIEWS = [[0, 0.15, 1], [1, 0.15, 0], [0, 0.15, -1], [0.7, 0.9, 0.7]];
ctx.font = "15px monospace";
for (let i = 0; i < files.length; i++) {
	const y0 = i * (T + LBL);
	ctx.fillStyle = "#222"; ctx.fillRect(0, y0, out.width, LBL); ctx.fillStyle = "#fff";
	let g;
	try { g = await loader.loadAsync("models/" + files[i] + ".glb"); }
	catch (e) { ctx.fillText(files[i] + "  (LOAD FAILED)", 6, y0 + 16); continue; }
	const box = new THREE.Box3().setFromObject(g.scene), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
	ctx.fillText(`${files[i]}   ${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)} m (w x h x d)`, 6, y0 + 16);
	scene.add(g.scene);
	const rad = size.length() / 2, d = rad / Math.sin(THREE.MathUtils.degToRad(15)) * 1.02;
	VIEWS.forEach((v, k) => {
		cam.position.copy(c).add(new THREE.Vector3(...v).normalize().multiplyScalar(d)); cam.lookAt(c);
		cam.near = d / 50; cam.far = d * 4; cam.updateProjectionMatrix();
		r.render(scene, cam); ctx.drawImage(r.domElement, k * T, y0 + LBL);
	});
	scene.remove(g.scene);
}
document.title = "done";
</script>
